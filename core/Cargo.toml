[package]
name = "apparition-core"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Apparition's native core: Apple ID sign-in, signing (isideload) and device services (idevice) behind one C ABI"

[lib]
crate-type = ["staticlib"]

[dependencies]
# Linked here, rather than as a second static library, so the app carries one Rust runtime.
idevice-ffi = { git = "https://github.com/jkcoxson/idevice.git", rev = "3854a5df4a5a6dee71ffce4d8befc2ea356a8065" }
idevice = { git = "https://github.com/jkcoxson/idevice.git", rev = "3854a5df4a5a6dee71ffce4d8befc2ea356a8065", default-features = false, features = ["ring", "core_device", "debug_proxy", "rsd", "remote_pairing", "tcp", "tunnel_tcp_stack"] }
isideload = { git = "https://github.com/nab138/isideload.git", rev = "0bee45d8cdb07ca24524a26f38fdda0dbb4e04b3", default-features = false, features = ["install", "tokio-mt"] }
rootcause = "0.12.0"
rustls = { version = "0.23", default-features = false, features = ["ring", "tls12", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.49", features = ["rt-multi-thread"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
zip = { version = "8.3", default-features = false, features = ["deflate"] }

# isideload depends on idevice from crates.io; use the same revision the FFI is built from,
# so the binary carries one copy of it.
[patch.crates-io]
idevice = { git = "https://github.com/jkcoxson/idevice.git", rev = "3854a5df4a5a6dee71ffce4d8befc2ea356a8065" }

[profile.release]
lto = "thin"
