# Self-hosted anisette for Apparition: Dadoum's anisette-v3-server, pulled from its own registry.
# Apparition ships no default anisette server. Run this on a machine Apparition can reach (the
# companion's Mac or PC, a home server; over Tailscale when away), then enter
# http://<that machine>:6969 in Apparition.
#
#   docker compose -f selfhost/anisette/compose.yaml up -d
#
# The image is pinned by digest so an upstream change can't alter what runs without a
# deliberate update here. The volume keeps the downloaded Apple library and the server's
# state across restarts.
name: apparition-anisette
services:
  anisette:
    image: dadoum/anisette-v3-server@sha256:8577c27cb7592900947960799bf03c79a53bf857ed951e4c48ef6e06c6e0f488
    restart: unless-stopped
    ports:
      - "6969:6969"
    volumes:
      - data:/home/Alcoholic/.config/anisette-v3/lib
volumes:
  data:
