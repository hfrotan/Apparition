name: Apparition
options:
  bundleIdPrefix: com.illixion
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
packages:
  DebugTrace:
    path: ../DebugTrace
targets:
  Apparition:
    type: application
    platform: iOS
    sources:
      - path: Probe
        excludes:
          - Info.plist
    dependencies:
      - package: DebugTrace
        product: DebugTrace
      - package: DebugTrace
        product: DebugTraceServer
      - package: DebugTrace
        product: DebugTraceUI
    info:
      path: Probe/Info.plist
      properties:
        CFBundleDisplayName: Apparition
        CFBundleShortVersionString: "0.1"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIBackgroundModes:
          - fetch
          - processing
        BGTaskSchedulerPermittedIdentifiers:
          - com.illixion.apparition.refresh
          - com.illixion.apparition.refresh-processing
        NSLocalNetworkUsageDescription: Apparition pairs with this device's own developer services over the local network.
        NSBonjourServices:
          - _remotepairing._tcp
          - _remotepairing-manual-pairing._tcp
          - _apparition._tcp
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.illixion.apparition
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_OBJC_BRIDGING_HEADER: Probe/Apparition-Bridging-Header.h
        HEADER_SEARCH_PATHS: $(SRCROOT)/build/core-out/include
        LIBRARY_SEARCH_PATHS: $(SRCROOT)/build/core-out/lib
        OTHER_LDFLAGS: -lapparition_core
        SWIFT_STRICT_CONCURRENCY: minimal
  ApparitionLab:
    type: application
    platform: iOS
    sources:
      - path: Lab
        excludes:
          - Info.plist
    info:
      path: Lab/Info.plist
      properties:
        CFBundleDisplayName: Apparition Lab
        CFBundleShortVersionString: "0.1"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIFileSharingEnabled: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.illixion.apparition.lab
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_OBJC_BRIDGING_HEADER: Lab/ApparitionLab-Bridging-Header.h
        SWIFT_STRICT_CONCURRENCY: minimal
  ApparitionCompanion:
    type: application
    platform: macOS
    sources:
      - path: Companion
        excludes:
          - Info.plist
      - path: selfhost/anisette/compose.yaml
        buildPhase: resources
    dependencies:
      - package: DebugTrace
        product: DebugTrace
    info:
      path: Companion/Info.plist
      properties:
        CFBundleDisplayName: Apparition Companion
        CFBundleShortVersionString: "0.1"
        CFBundleVersion: "1"
        NSLocalNetworkUsageDescription: Apparition Companion relays Apparition's connection back to your headset over the local network.
        NSBonjourServices:
          - _apparition._tcp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.illixion.apparition.companion
        DEVELOPMENT_TEAM: 9T5F88VJFL
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_STRICT_CONCURRENCY: minimal
