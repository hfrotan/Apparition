name: Apparition
options:
  bundleIdPrefix: com.illixion
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
packages:
  DebugTrace:
    path: ../DebugTrace
targets:
  Apparition:
    type: application
    platform: iOS
    sources:
      - path: Probe
        excludes:
          - Info.plist
    dependencies:
      - package: DebugTrace
        product: DebugTrace
      - package: DebugTrace
        product: DebugTraceServer
      - package: DebugTrace
        product: DebugTraceUI
    info:
      path: Probe/Info.plist
      properties:
        CFBundleDisplayName: Apparition
        CFBundleShortVersionString: "0.1"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSLocalNetworkUsageDescription: Apparition pairs with this device's own developer services over the local network.
        NSBonjourServices:
          - _remotepairing._tcp
          - _remotepairing-manual-pairing._tcp
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.illixion.apparition
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_OBJC_BRIDGING_HEADER: Probe/Apparition-Bridging-Header.h
        HEADER_SEARCH_PATHS: $(SRCROOT)/build/core-out/include
        LIBRARY_SEARCH_PATHS: $(SRCROOT)/build/core-out/lib
        OTHER_LDFLAGS: -lapparition_core
        SWIFT_STRICT_CONCURRENCY: minimal
