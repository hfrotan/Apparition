PROJECT_PATH="Apparition.xcodeproj"
# SCHEME_NAME=ApparitionLab TARGET_NAME=ApparitionLab BUILD_BUNDLE_ID=com.illixion.apparition.lab deploys the lab.
SCHEME_NAME="${SCHEME_NAME:-Apparition}"
TARGET_NAME="${TARGET_NAME:-Apparition}"
# The app is native visionOS; the lab is still an iOS app.
if [[ "$SCHEME_NAME" == ApparitionLab ]]; then PLATFORM="${PLATFORM:-iOS}"; else PLATFORM="${PLATFORM:-visionOS}"; fi
DEVICE_NAME="AVP"
BUILD_BUNDLE_ID="${BUILD_BUNDLE_ID:-com.illixion.apparition}"
